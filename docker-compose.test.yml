version: '3.8'

services:
  # MongoDB service for testing
  mongodb_test:
    image: mongo:latest
    container_name: fitness_db_test
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo_test_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitness_test_network

  # Flask API service for testing
  api_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitness_api_test
    environment:
      # Database configuration
      MONGO_URI: "mongodb://root:rootpassword@mongodb_test:27017"
      DB_NAME: "fitness_db_test"
      
      # Application settings
      DEBUG: "true"
      FLASK_APP: "app"
      
      # JWT configuration
      JWT_SECRET_KEY: "test-secret-key"
      
      # AWS SES configuration (empty for tests)
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_REGION: "eu-north-1"
      SES_SENDER_EMAIL: ""
      
      # Telegram configuration (empty for tests)
      TELEGRAM_BOT_TOKEN: ""
      
      # Use mock database for tests
      MOCK_DB: "false"
    
    depends_on:
      mongodb_test:
        condition: service_healthy
    
    volumes:
      - .:/app
    
    networks:
      - fitness_test_network
    
    command: sh -c "pip install -r requirements-dev.txt && pytest tests/ -v --cov=app --cov-report=html"

volumes:
  mongo_test_data:
    driver: local

networks:
  fitness_test_network:
    driver: bridge